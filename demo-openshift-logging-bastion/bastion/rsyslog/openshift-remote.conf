# OpenShift ClusterLogForwarder syslog receiver
# Install: scripts/install-bastion-receiver.sh (copies to /etc/rsyslog.d/)

module(load="imtcp")
input(type="imtcp" port="514" ruleset="openshiftRemote")
input(type="imtcp" port="10514" ruleset="openshiftRemote")

ruleset(name="openshiftRemote") {
    action(type="omfile" file="/var/log/openshift-remote.log")
}
