apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: fx-rate-lightwell
  namespace: fxrate-ci
  labels:
    app.kubernetes.io/part-of: fx-rate-demo
    demo.fxrate.index: lightwell-mock
spec:
  description: >
    Lab mock of Lightwell backport-in-place: same RHHI + app path, but pip installs
    Act 0 upstream versions with +rhlw-0001 from Nexus pypi-hosted-rhlw
    (urllib3==1.26.14+rhlw-0001). Full end-to-end SALA L3 pipeline identical to
    fx-rate-act3b: sign/ACS/SBOM/TPA/GitOps/Conforma/promote MR.
    Running this WILL pin dev to the rhlw image and open a prod promote MR.
    See cluster/docs/LIGHTWELL-MOCK.md.
  params:
    - name: git-url
      type: string
      default: https://gitlab-gitlab.apps.<YOUR_CLUSTER_DOMAIN>/fxrate/python-cve-upgrade-demo.git
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
      default: quay.apps.<YOUR_CLUSTER_DOMAIN>/fxrate/fx-rate-service
    - name: image-tag
      type: string
      default: 3.0.0-rhlw
    - name: dockerfile
      type: string
      default: fx-rate-service/Containerfile.rhlw
    - name: context
      type: string
      default: fx-rate-service
    - name: pip-index-url
      type: string
      default: https://nexus.apps.<YOUR_CLUSTER_DOMAIN>/repository/pypi-hosted-rhlw/simple
    - name: pip-tooling-index-url
      type: string
      description: pytest/pip-audit feed (narrow RHLW hosted repo has no pytest)
      default: https://nexus.apps.<YOUR_CLUSTER_DOMAIN>/repository/pypi-proxy-pypi/simple
    - name: pip-trusted-host
      type: string
      default: nexus.apps.<YOUR_CLUSTER_DOMAIN>
    - name: lockfile
      type: string
      default: requirements-rhlw.txt
    - name: rhhi-builder
      type: string
      default: registry.access.redhat.com/hi/python@sha256:95e23e434d7c047ab9bc540d8ec3c665c1f815179dd1c3b7aa06627d2feecc64
    - name: rhhi-runtime
      type: string
      default: registry.access.redhat.com/hi/python@sha256:f703228646dfeae7a962d1ee720e5cb16031dcfee88eb064453dcefd09670e05
    - name: acs-fail-on-policy
      type: string
      default: "false"
    - name: acs-check-fail-on-policy
      type: string
      default: "false"
  workspaces:
    - name: source
    - name: basic-auth
    - name: dockerconfig
    - name: acs-token
    - name: cosign-key
    - name: sonar-credentials
  tasks:
    - name: clone-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: SSL_VERIFY
          value: "false"
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth

    - name: test
      runAfter: [clone-source]
      taskRef:
        name: pytest-pip-audit
      params:
        - name: CONTEXT
          value: $(params.context)
        - name: PIP_INDEX_URL
          value: $(params.pip-index-url)
        - name: PIP_TOOLING_INDEX_URL
          value: $(params.pip-tooling-index-url)
        - name: PIP_TRUSTED_HOST
          value: $(params.pip-trusted-host)
        - name: LOCKFILE
          value: $(params.lockfile)
        - name: PYTHON_IMAGE
          value: $(params.rhhi-builder)
      workspaces:
        - name: source
          workspace: source

    - name: sonar-scan
      runAfter: [test]
      taskRef:
        name: sonar-scan-python
      params:
        - name: CONTEXT
          value: $(params.context)
      workspaces:
        - name: source
          workspace: source
        - name: sonar-credentials
          workspace: sonar-credentials

    - name: build-and-push
      runAfter: [sonar-scan]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.image):$(params.image-tag)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.context)
        - name: TLS_VERIFY
          value: "false"
        - name: STORAGE_DRIVER
          value: vfs
        - name: BUILD_ARGS
          value:
            - RHHI_BUILDER=$(params.rhhi-builder)
            - RHHI_RUNTIME=$(params.rhhi-runtime)
            - PIP_INDEX_URL=$(params.pip-index-url)
            - PIP_TRUSTED_HOST=$(params.pip-trusted-host)
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig

    - name: sign-sbom
      runAfter: [build-and-push]
      taskRef:
        name: cosign-sign-sbom
      params:
        - name: IMAGE
          value: $(params.image)
        - name: IMAGE_DIGEST
          value: $(tasks.build-and-push.results.IMAGE_DIGEST)
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
        - name: cosign-key
          workspace: cosign-key

    - name: acs-scan
      runAfter: [sign-sbom]
      taskRef:
        name: acs-image-scan
      params:
        - name: IMAGE
          value: $(params.image)
        - name: IMAGE_DIGEST
          value: $(tasks.build-and-push.results.IMAGE_DIGEST)
        - name: FAIL_ON_POLICY_VIOLATIONS
          value: $(params.acs-fail-on-policy)
      workspaces:
        - name: acs-token
          workspace: acs-token

    - name: acs-check
      runAfter: [acs-scan]
      taskRef:
        name: acs-image-check
      params:
        - name: IMAGE
          value: $(params.image)@$(tasks.build-and-push.results.IMAGE_DIGEST)
        - name: FAIL_ON_POLICY_VIOLATIONS
          value: $(params.acs-check-fail-on-policy)
      workspaces:
        - name: acs-token
          workspace: acs-token

    - name: generate-sbom
      runAfter: [acs-check]
      taskRef:
        name: generate-sbom-cdx
      params:
        - name: IMAGE
          value: $(params.image)@$(tasks.build-and-push.results.IMAGE_DIGEST)
        - name: SOURCE_NAME
          value: fx-rate-service
        - name: SOURCE_VERSION
          value: $(params.image-tag)
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig

    - name: upload-sbom-to-tpa
      runAfter: [generate-sbom]
      taskRef:
        name: upload-sbom-to-tpa
      params:
        - name: LABEL_COMPONENT
          value: fx-rate-service
        - name: LABEL_DEV
          value: fxrate
        - name: LABEL_STAGE
          value: lightwell
      workspaces:
        - name: source
          workspace: source

    - name: update-gitops
      runAfter: [upload-sbom-to-tpa]
      taskRef:
        name: update-gitops-digest
      params:
        - name: IMAGE
          value: $(params.image)
        - name: IMAGE_DIGEST
          value: $(tasks.build-and-push.results.IMAGE_DIGEST)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
      workspaces:
        - name: basic-auth
          workspace: basic-auth

    - name: trigger-validation
      runAfter: [update-gitops]
      taskRef:
        name: trigger-validation
      params:
        - name: IMAGE
          value: $(params.image)@$(tasks.build-and-push.results.IMAGE_DIGEST)
        - name: GIT_REVISION
          value: $(params.git-revision)
        - name: IMAGE_TAG
          value: $(params.image-tag)
