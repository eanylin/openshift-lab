# GitLab → Tekton Triggers for fx-rate-ci (DevSpaces / laptop push to main).
# Apply: bash cluster/tekton/setup-triggers.sh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fx-rate-triggers
  namespace: fxrate-ci
  labels:
    app.kubernetes.io/part-of: fx-rate-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fx-rate-triggers-pipeline
  namespace: fxrate-ci
  labels:
    app.kubernetes.io/part-of: fx-rate-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: fx-rate-triggers
    namespace: fxrate-ci
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: fx-rate-push-binding
  namespace: fxrate-ci
  labels:
    app.kubernetes.io/part-of: fx-rate-demo
spec:
  params:
    - name: git-revision
      value: $(body.after)
    - name: git-repo-url
      value: $(body.project.git_http_url)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fx-rate-push-template
  namespace: fxrate-ci
  labels:
    app.kubernetes.io/part-of: fx-rate-demo
spec:
  params:
    - name: git-revision
    - name: git-repo-url
      default: https://gitlab-gitlab.apps.<YOUR_CLUSTER_DOMAIN>/fxrate/python-cve-upgrade-demo.git
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: fx-rate-act3b-push-
        namespace: fxrate-ci
        labels:
          app.kubernetes.io/part-of: fx-rate-demo
          demo.fxrate.trigger: gitlab-push
      spec:
        serviceAccountName: pipeline
        pipelineRef:
          name: fx-rate-act3b
        params:
          - name: git-url
            value: $(tt.params.git-repo-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-tag
            value: 3.0.0-act3b
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 2Gi
          - name: basic-auth
            secret:
              secretName: gitlab-basic-auth
          - name: dockerconfig
            secret:
              secretName: quay-push-secret
          - name: acs-token
            secret:
              secretName: acs-api-token
          - name: cosign-key
            secret:
              secretName: cosign-signing
          - name: sonar-credentials
            secret:
              secretName: sonarqube-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: fx-rate-listener
  namespace: fxrate-ci
  labels:
    app.kubernetes.io/part-of: fx-rate-demo
spec:
  serviceAccountName: fx-rate-triggers
  triggers:
    - name: push-main
      interceptors:
        - ref:
            kind: ClusterInterceptor
            name: gitlab
          params:
            - name: secretRef
              value:
                secretName: gitlab-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - Push Hook
        - ref:
            kind: ClusterInterceptor
            name: cel
          params:
            - name: filter
              # Skip digest-only CI pins (avoids rebuild loop after update-gitops).
              value: >-
                body.ref == 'refs/heads/main' &&
                body.after != '0000000000000000000000000000000000000000' &&
                (size(body.commits) == 0 ||
                 (!body.commits[size(body.commits) - 1].message.startsWith('ci: pin fxrate-dev') &&
                  !body.commits[size(body.commits) - 1].message.contains('[skip ci]')))
      bindings:
        - ref: fx-rate-push-binding
      template:
        ref: fx-rate-push-template
---
# Edge route for GitLab webhooks (cluster-external).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fx-rate-listener
  namespace: fxrate-ci
  labels:
    app.kubernetes.io/part-of: fx-rate-demo
spec:
  to:
    kind: Service
    name: el-fx-rate-listener
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
